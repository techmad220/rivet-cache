[package]
name = "rivet-cache"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "DI-first Rust KV cache with device tiers, remote connectors, disaggregated runtime orchestration, and reuse control."
repository = "https://github.com/techmad220/rivet-cache"
readme = "README.md"
keywords = ["cache", "llm", "inference", "lru", "persistence"]
categories = ["caching", "filesystem"]

[features]
default = []
# NIXL is Linux-only upstream. The default RivetCache build keeps its existing
# dependency/MSRV surface; enable this only on hosts with a compatible NIXL runtime.
nixl = ["dep:nixl-sys"]
# Compile the NIXL adapter without a native NIXL installation. Upstream stubs
# abort if invoked, so this feature is for compile/rustdoc coverage only.
nixl-stub = ["nixl", "nixl-sys/stub-api"]

[dependencies]
hex = "0.4"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nixl-sys = { version = "1.4.0", optional = true }
