[package]
name = "rivet-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Fast bounded two-tier cache with stable namespaced keys, LRU, TTL, pinning, atomic persistence, checksums, corruption recovery, and telemetry."
repository = "https://github.com/techmad220/rivet-cache"
readme = "README.md"
keywords = ["cache", "llm", "inference", "lru", "persistence"]
categories = ["caching", "filesystem"]

[dependencies]
hex = "0.4"
sha2 = "0.10"
