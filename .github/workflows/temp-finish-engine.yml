name: Temporary production engine finisher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.ref == 'feat/production-cache-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply production engine patch
        run: python tools/finish_engine.py

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Remove one-shot tooling
        run: |
          rm -f tools/finish_engine.py
          rm -f .github/workflows/temp-finish-engine.yml
          rmdir tools 2>/dev/null || true

      - name: Commit certified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete composable cache engine"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
