name: Temporary v0.7 normalize and validate

on:
  push:
    branches: [feat/v0.7-production-breadth]

permissions:
  contents: write

concurrency:
  group: rivet-v07-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/v0.7-production-breadth
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Normalize source
        run: cargo fmt --all

      - name: Debug tests
        run: cargo test --all-targets

      - name: Release tests
        run: cargo test --release --all-targets

      - name: Strict clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release --all-targets

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Declared Rust 1.75 API floor
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 check --all-targets

      - name: Commit normalization only after all gates pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo "RIVET_V07_NORMALIZE=NO_CHANGES"
            exit 0
          fi
          git config user.name "techmad220"
          git config user.email "143960678+techmad220@users.noreply.github.com"
          git add src Cargo.toml
          git commit -m "Normalize RivetCache v0.7 production modules"
          git push origin HEAD:feat/v0.7-production-breadth
          echo "RIVET_V07_NORMALIZE=PUSHED"
