name: Temporary v0.7 normalize and validate

on:
  push:
    branches: [feat/v0.7-production-breadth]

permissions:
  contents: write

concurrency:
  group: rivet-v07-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/v0.7-production-breadth
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Repair crate-root integration and quality gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = cargo.replace('[lib]\npath = "src/lib_v07.rs"\n\n', '')
          cargo_path.write_text(cargo)

          lib_path = Path('src/lib.rs')
          lib = lib_path.read_text()
          old_modules = '''mod device;
          mod kv;
          mod llama_cpp;
          mod policy;
          mod remote;
          mod reuse;
          mod store;
          '''
          new_modules = '''mod codec;
          mod connectors;
          mod control;
          mod device;
          mod distributed;
          mod gpu_direct;
          mod kv;
          mod llama_cpp;
          mod memory;
          mod observability;
          mod plugins;
          mod policy;
          mod quality;
          mod remote;
          mod reuse;
          mod store;
          '''
          if old_modules in lib:
              lib = lib.replace(old_modules, new_modules, 1)
          elif 'mod codec;' not in lib or 'mod quality;' not in lib:
              raise SystemExit('crate module header is neither legacy nor integrated')

          store_exports = '''pub use store::{
              FileStore, LayeredStore, PersistentStore, PutOutcome, StoreRecord, StoreSnapshot, StoredEntry,
              VolatileStore,
          };
          '''
          additions = store_exports + '''pub use codec::{CodecKvTier, CodecRegistry, IdentityCodec, PayloadCodec, RleCodec};
          pub use connectors::{
              HttpClient, HttpRequest, HttpResponse, RedisAuth, RedisDialer, RedisKvTier, RedisStream,
              S3Clock, S3Config, S3Credentials, S3KvTier, SystemS3Clock, TcpHttpClient, TcpRedisDialer,
          };
          pub use control::{
              CacheController, ControllerServer, FleetNode, FleetRegistry, QuotaManager, RequestLease,
              StorageReservation, TenantQuota, TenantSnapshot, TenantUsage,
          };
          pub use distributed::{
              DeviceTransferFn, DeviceTransferHealthFn, DeviceTransferProvider, DirectTransferRequest,
              DisaggregatedKvRouter, FfiDeviceTransferOps, FfiDeviceTransferProvider, KvHandoffReport,
              TransportCapabilities, TransportKind, WorkerRole,
          };
          pub use gpu_direct::{
              FfiGpuDirectIo, FfiGpuDirectOps, GpuCopyFn, GpuDirectCapabilities, GpuDirectHealthFn,
              GpuDirectIo, GpuFileReadFn, GpuFileWriteFn,
          };
          pub use memory::{
              HeapPageAllocator, NativePinnedAllocator, PageAllocator, PinnedLease, PinnedMemoryPool,
              PinnedPoolStats,
          };
          pub use observability::{InstrumentedKvTier, PrometheusRegistry};
          pub use plugins::{
              CodecPluginFactory, KvTierPluginFactory, PluginComponent, PluginManifest, PluginRegistry,
              TransportPluginFactory,
          };
          pub use quality::{
              apply_quality_reuse, plan_quality_reuse, QualityAwareRuntimeKvAdapter, QualityReusePlan,
              QualityReusePolicy, TokenRange,
          };
          '''
          if 'pub use codec::{CodecKvTier' not in lib:
              if store_exports not in lib:
                  raise SystemExit('store export block not found')
              lib = lib.replace(store_exports, additions, 1)
          lib_path.write_text(lib)

          legacy_wrapper = Path('src/lib_v07.rs')
          if legacy_wrapper.exists():
              legacy_wrapper.unlink()

          connectors_path = Path('src/connectors.rs')
          connectors = connectors_path.read_text()
          connectors = connectors.replace('use std::collections::HashMap;\n', '')
          connectors = connectors.replace(
              'use std::io::{self, BufRead, BufReader, Cursor, Read, Write};',
              'use std::io::{self, BufRead, BufReader, Read, Write};',
          )
          connectors = connectors.replace('use std::sync::{Arc, Mutex};', 'use std::sync::Arc;')
          test_marker = '    use crate::KvBlockRange;\n'
          test_imports = test_marker + '    use std::collections::HashMap;\n    use std::io::Cursor;\n    use std::sync::Mutex;\n'
          if '    use std::io::Cursor;\n' not in connectors:
              if test_marker not in connectors:
                  raise SystemExit('connector test marker not found')
              connectors = connectors.replace(test_marker, test_imports, 1)
          connectors = connectors.replace(
              'RespValue::Integer(_) => Ok(()),',
              'RespValue::Integer(removed) if removed >= 0 => Ok(()),',
          )
          connectors = connectors.replace(
              'RespValue::Integer(_) => {}',
              'RespValue::Integer(removed) if removed >= 0 => {}',
          )
          connectors_path.write_text(connectors)

          control_path = Path('src/control.rs')
          control = control_path.read_text()
          control = control.replace(
              '''return Err(io::Error::new(
                          io::ErrorKind::StorageFull,
                          format!("tenant {tenant} exceeded storage quota"),
                      ));''',
              '''return Err(io::Error::other(format!(
                          "tenant {tenant} exceeded storage quota"
                      )));''',
          )
          control = control.replace(
              '''return Err(io::Error::new(
                          io::ErrorKind::Other,
                          format!("tenant {tenant} exceeded storage quota"),
                      ));''',
              '''return Err(io::Error::other(format!(
                          "tenant {tenant} exceeded storage quota"
                      )));''',
          )
          control = control.replace(
              'quotas.begin_request("tenant-a").unwrap_err().kind(),',
              'quotas\n                .begin_request("tenant-a")\n                .err()\n                .expect("inflight quota error")\n                .kind(),',
          )
          control_path.write_text(control)

          memory_path = Path('src/memory.rs')
          memory = memory_path.read_text()
          memory = memory.replace(
              'pool.acquire(1024, Some(0)).unwrap_err().kind(),',
              'pool.acquire(1024, Some(0))\n                .err()\n                .expect("unsupported NUMA error")\n                .kind(),',
          )
          memory_path.write_text(memory)

          observability_path = Path('src/observability.rs')
          observability = observability_path.read_text()
          observability = observability.replace(
              '#[derive(Debug, Clone)]\nstruct Histogram {',
              '#[derive(Debug, Clone, Default)]\nstruct Histogram {',
          )
          manual_default = '''
          impl Default for Histogram {
              fn default() -> Self {
                  Self {
                      buckets: [0; 8],
                      count: 0,
                      sum_micros: 0,
                  }
              }
          }
          '''
          observability = observability.replace(manual_default, '\n')
          observability_path.write_text(observability)
          PY

      - name: Normalize source
        run: cargo fmt --all

      - name: Debug tests
        run: cargo test --all-targets

      - name: Release tests
        run: cargo test --release --all-targets

      - name: Strict clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release --all-targets

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Declared Rust 1.75 API floor
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 check --all-targets

      - name: Commit normalized exact candidate and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-v0.7-normalize.yml
          git config user.name "techmad220"
          git config user.email "143960678+techmad220@users.noreply.github.com"
          git add -A src Cargo.toml
          git commit -m "Integrate and normalize RivetCache v0.7 production modules"
          git push origin HEAD:feat/v0.7-production-breadth
          echo "RIVET_V07_NORMALIZE=PUSHED"
