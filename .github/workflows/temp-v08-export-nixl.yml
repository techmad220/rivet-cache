name: Temporary v0.8 NIXL export patch

on:
  push:
    branches: [feat/v0.8-external-interoperability]
    paths: ['.github/workflows/temp-v08-export-nixl.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/v0.8-external-interoperability
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Export NIXL API and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib.rs')
          s = p.read_text()
          mod_line = '#[cfg(all(target_os = "linux", feature = "nixl"))]\nmod nixl_native;\n'
          if mod_line not in s:
              anchor = 'mod memory;\n'
              if anchor not in s:
                  raise SystemExit('lib.rs module anchor not found')
              s = s.replace(anchor, anchor + mod_line, 1)
          use_block = '#[cfg(all(target_os = "linux", feature = "nixl"))]\npub use nixl_native::{NixlEndpoint, NixlHostBuffer, NixlRemoteRegion, NixlTransferReceipt};\n'
          if use_block not in s:
              anchor = 'pub use observability::{InstrumentedKvTier, PrometheusRegistry};\n'
              if anchor not in s:
                  raise SystemExit('lib.rs export anchor not found')
              s = s.replace(anchor, use_block + anchor, 1)
          p.write_text(s)
          PY
          rm .github/workflows/temp-v08-export-nixl.yml
          cargo fmt --all
          cargo check
          cargo check --features nixl-stub --bin rivet-cache-nixl-cert
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs .github/workflows/temp-v08-export-nixl.yml
          git commit -m 'Expose optional native NIXL API'
          git push origin HEAD:feat/v0.8-external-interoperability
