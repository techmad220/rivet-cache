name: Temporary v0.5 completion gate

on:
  push:
    branches: [feat/distributed-runtime-completion]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/distributed-runtime-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Wire production modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kv = Path('src/kv.rs')
          text = kv.read_text()
          old = '''pub trait KvTier: Send + Sync {
              fn name(&self) -> &str;
              fn get(&self, key: &KvBlockKey) -> io::Result<Option<KvTierEntry>>;
              fn put(&self, entry: &KvTierEntry) -> io::Result<()>;
              fn remove(&self, key: &KvBlockKey) -> io::Result<()>;
          }
          '''
          new = '''pub trait KvTier: Send + Sync {
              fn name(&self) -> &str;
              fn get(&self, key: &KvBlockKey) -> io::Result<Option<KvTierEntry>>;
              fn put(&self, entry: &KvTierEntry) -> io::Result<()>;
              fn remove(&self, key: &KvBlockKey) -> io::Result<()>;
              fn clear(&self) -> io::Result<()> {
                  Err(io::Error::new(
                      io::ErrorKind::Unsupported,
                      format!("KV tier {} does not implement clear", self.name()),
                  ))
              }
              fn health(&self) -> io::Result<()> {
                  Ok(())
              }
          }
          '''
          if old not in text:
              raise SystemExit('KvTier marker not found')
          text = text.replace(old, new, 1)

          old = '''    fn remove(&self, key: &KvBlockKey) -> io::Result<()> {
                  self.cache.invalidate(&key.cache_key())
              }
          }
          '''
          new = '''    fn remove(&self, key: &KvBlockKey) -> io::Result<()> {
                  self.cache.invalidate(&key.cache_key())
              }

              fn clear(&self) -> io::Result<()> {
                  self.cache.clear()
              }
          }
          '''
          if old not in text:
              raise SystemExit('ContextCacheTier remove marker not found')
          text = text.replace(old, new, 1)

          marker = '''#[derive(Debug, Clone, Copy, Default, PartialEq, Eq)]
          pub struct KvEngineStats {
          '''
          health = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub struct KvTierHealth {
              pub name: String,
              pub healthy: bool,
              pub error: Option<String>,
          }

          '''
          if marker not in text:
              raise SystemExit('KvEngineStats marker not found')
          text = text.replace(marker, health + marker, 1)

          old = '''    pub fn invalidate(&self, key: &KvBlockKey) -> io::Result<()> {
                  for tier in &self.inner.tiers {
                      tier.remove(key)?;
                  }
                  let mut stats = self.stats_mut()?;
                  stats.invalidations = stats.invalidations.saturating_add(1);
                  Ok(())
              }

              pub fn prefetch_to(&self, keys: Vec<KvBlockKey>, destination_index: usize) -> KvPrefetch {
          '''
          new = '''    pub fn invalidate(&self, key: &KvBlockKey) -> io::Result<()> {
                  for tier in &self.inner.tiers {
                      tier.remove(key)?;
                  }
                  let mut stats = self.stats_mut()?;
                  stats.invalidations = stats.invalidations.saturating_add(1);
                  Ok(())
              }

              pub fn set_pinned(&self, key: &KvBlockKey, pinned: bool) -> io::Result<bool> {
                  let now = self.inner.clock.now_seconds();
                  let mut found = false;
                  for tier in &self.inner.tiers {
                      let Some(mut entry) = tier.get(key)? else {
                          continue;
                      };
                      if is_expired(entry.expires_at, now) {
                          tier.remove(key)?;
                          let mut stats = self.stats_mut()?;
                          stats.expirations = stats.expirations.saturating_add(1);
                          continue;
                      }
                      entry.pinned = pinned;
                      tier.put(&entry)?;
                      found = true;
                  }
                  Ok(found)
              }

              pub fn clear(&self) -> io::Result<()> {
                  let mut first_error = None;
                  for tier in &self.inner.tiers {
                      if let Err(error) = tier.clear() {
                          if first_error.is_none() {
                              first_error = Some(error);
                          }
                      }
                  }
                  match first_error {
                      Some(error) => Err(error),
                      None => Ok(()),
                  }
              }

              pub fn health(&self) -> Vec<KvTierHealth> {
                  self.inner
                      .tiers
                      .iter()
                      .map(|tier| match tier.health() {
                          Ok(()) => KvTierHealth {
                              name: tier.name().to_string(),
                              healthy: true,
                              error: None,
                          },
                          Err(error) => KvTierHealth {
                              name: tier.name().to_string(),
                              healthy: false,
                              error: Some(error.to_string()),
                          },
                      })
                      .collect()
              }

              pub fn prefetch_to(&self, keys: Vec<KvBlockKey>, destination_index: usize) -> KvPrefetch {
          '''
          if old not in text:
              raise SystemExit('invalidate marker not found')
          text = text.replace(old, new, 1)
          kv.write_text(text)

          lib = Path('src/lib.rs')
          text = lib.read_text()
          old = '''mod kv;
          mod policy;
          mod store;
          '''
          new = '''mod device;
          mod kv;
          mod llama_cpp;
          mod policy;
          mod remote;
          mod reuse;
          mod store;
          '''
          if old not in text:
              raise SystemExit('lib module marker not found')
          text = text.replace(old, new, 1)
          old = '''pub use kv::{
              ContextCacheTier, CopyTransport, KvAllocator, KvBlock, KvBlockKey, KvBlockRange,
              KvCaptureRequest, KvEngine, KvEngineBuilder, KvEngineStats, KvPrefetch, KvTier, KvTierEntry,
              KvTransport, KvWritePolicy, PrefetchReport, PrefixIndex, PrefixMatch, RuntimeKvAdapter,
              VecAllocator,
          };
          '''
          new = '''pub use device::{
              DeviceAllocFn, DeviceBuffer, DeviceDownloadFn, DeviceFreeFn, DeviceHealthFn,
              DeviceKvTier, DeviceMemory, DeviceUploadFn, FfiDeviceMemory, FfiDeviceOps,
              HostDeviceMemory,
          };
          pub use kv::{
              ContextCacheTier, CopyTransport, KvAllocator, KvBlock, KvBlockKey, KvBlockRange,
              KvCaptureRequest, KvEngine, KvEngineBuilder, KvEngineStats, KvPrefetch, KvTier,
              KvTierEntry, KvTierHealth, KvTransport, KvWritePolicy, PrefetchReport, PrefixIndex,
              PrefixMatch, RuntimeKvAdapter, VecAllocator,
          };
          pub use llama_cpp::{
              FfiLlamaCppKvApi, LlamaCppAdapter, LlamaCppFfiOps, LlamaCppKvApi, LlamaHealthFn,
              LlamaKvSlice, LlamaReadKvFn, LlamaWriteKvFn, MockLlamaCppKvApi,
          };
          pub use remote::{RemoteLimits, TcpKvServer, TcpKvTier};
          pub use reuse::{
              restore_reuse, RelocatableRuntimeKvAdapter, ReuseSpan, SegmentIndex,
          };
          '''
          if old not in text:
              raise SystemExit('lib export marker not found')
          text = text.replace(old, new, 1)
          lib.write_text(text)

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          text = text.replace('version = "0.4.0"', 'version = "0.5.0"', 1)
          text = text.replace(
              'description = "DI-first Rust cache with composable storage tiers and runtime-neutral KV orchestration."',
              'description = "DI-first Rust KV cache with device tiers, remote service mode, runtime adapters, and reuse orchestration."',
              1,
          )
          cargo.write_text(text)

          changelog = Path('CHANGELOG.md')
          existing = changelog.read_text()
          entry = '''## 0.5.0 - 2026-08-28

- Added a standalone std-only TCP KV service and `TcpKvTier` client with bounded payloads, connection limits, timeouts, health checks, clear, get, put, and remove operations.
- Added `DeviceKvTier`, a device-buffer ownership layer, a host reference backend, and an unsafe opt-in FFI callback bridge for accelerator runtimes.
- Added a llama.cpp host-callback runtime adapter with capture, restore, health, and relocated restore for exact reusable segments.
- Added `SegmentIndex` and `restore_reuse` for deterministic block-aligned non-prefix exact segment reuse.
- Added tier health, clear, and pin/unpin control operations to `KvEngine`.
- Kept network/device/runtime integrations optional and dependency-injected; the core remains free of mandatory async, networking framework, GPU SDK, or inference-engine dependencies.

'''
          if '## 0.5.0 - 2026-08-28' not in existing:
              if existing.startswith('# Changelog'):
                  parts = existing.split('\n', 2)
                  existing = parts[0] + '\n\n' + entry + (parts[2] if len(parts) > 2 else '')
              else:
                  existing = entry + existing
          changelog.write_text(existing)

          readme = Path('README.md')
          existing = readme.read_text()
          section = '''
          ## Distributed/runtime KV layer

          RivetCache includes optional execution adapters around the DI-first cache core:

          - `TcpKvServer` + `TcpKvTier`: a standalone binary TCP KV service/client for cross-process or cross-host cache sharing. The bundled protocol intentionally does not embed authentication or TLS; use it only on trusted application networks or behind an authenticated/tunneled boundary.
          - `DeviceKvTier`: stores KV payloads in buffers owned by an injected `DeviceMemory` implementation. `FfiDeviceMemory` exposes an unsafe callback ABI that accelerator integrations can implement without linking a GPU SDK into the core crate.
          - `LlamaCppAdapter`: a host-callback adapter that maps RivetCache block ranges to capture/restore callbacks supplied by an embedding llama.cpp host. This callback contract is a RivetCache integration surface and does not claim compatibility with an upstream private/internal ABI.
          - `SegmentIndex`: finds exact contiguous token matches at non-prefix positions, aligns them to complete cached blocks, and can restore those blocks at a relocated token position through `RelocatableRuntimeKvAdapter`.
          - `KvEngine::health`, `KvEngine::clear`, and `KvEngine::set_pinned` provide direct management operations across configured tiers.

          The standalone server can be started with:

          ```text
          cargo run --bin rivet-cache-server -- 127.0.0.1:65432 ./rivet-cache-data 512 8192
          ```

          Public capability claims are limited to code paths implemented and tested in this repository. Hardware throughput, a specific external runtime build, transport interoperability outside the RivetCache protocol, and comparative performance require separate implementation-specific evidence.
          '''
          if '## Distributed/runtime KV layer' not in existing:
              existing = existing.rstrip() + '\n' + section + '\n'
          readme.write_text(existing)

          arch = Path('docs/architecture.md')
          existing = arch.read_text()
          section = '''
          ## v0.5 execution adapters

          The core cache remains runtime-neutral. Optional sibling modules supply execution-specific boundaries:

          - Remote service mode uses a versioned RivetCache TCP protocol with bounded messages and explicit health/clear operations. It is an application protocol, not an authenticated network perimeter.
          - Device storage owns opaque buffer handles through `DeviceMemory`. The FFI implementation delegates allocation/upload/download/free to caller-supplied callbacks and therefore can be bound to Vulkan, ROCm/HIP, CUDA, shared-memory, or other device systems without adding those SDKs to the core crate.
          - The llama.cpp adapter delegates KV extraction/injection to host callbacks defined by RivetCache. This avoids depending on unstable engine internals in the core library.
          - Non-prefix reuse is exact and block-aligned: `SegmentIndex` finds contiguous token subsequences and only returns complete registered KV blocks. Relocation is delegated to a runtime adapter. No approximate recomputation or quality-recovery algorithm is implied.
          '''
          if '## v0.5 execution adapters' not in existing:
              existing = existing.rstrip() + '\n\n' + section + '\n'
          arch.write_text(existing)
          PY
      - name: Remove one-shot workflow and format
        shell: bash
        run: |
          rm -f .github/workflows/temp-finish-v0.5.0.yml
          cargo fmt --all
      - name: Compile and test before commit
        run: cargo test --all-targets
      - name: Clippy before commit
        run: cargo clippy --all-targets -- -D warnings
      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete distributed and runtime KV execution layer'
          test -z "$(git status --porcelain)"
      - name: Exact clean candidate package gate
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo package --locked
          test -z "$(git status --porcelain)"
      - name: Push clean candidate
        run: git push origin HEAD:feat/distributed-runtime-completion
