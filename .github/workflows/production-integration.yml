name: Production Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIVET_S3_ACCESS_KEY: rivettest
      RIVET_S3_SECRET_KEY: rivettestpassword
      RIVET_S3_ENDPOINT: http://127.0.0.1:9000
      RIVET_S3_REGION: us-east-1
      RIVET_S3_BUCKET: rivet-cache-cert
      RIVET_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          echo "RIVET_PRODUCTION_EXACT_HEAD=$actual"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Start Redis and MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name rivet-redis -p 6379:6379 redis:7-alpine
          docker run -d --rm --name rivet-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$RIVET_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$RIVET_S3_SECRET_KEY" \
            minio/minio server /data --address :9000
          for i in $(seq 1 60); do
            if docker exec rivet-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker exec rivet-redis redis-cli ping | grep -q PONG
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
      - name: Create isolated S3 certification bucket
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --aws-sigv4 "aws:amz:${RIVET_S3_REGION}:s3" \
            --user "${RIVET_S3_ACCESS_KEY}:${RIVET_S3_SECRET_KEY}" \
            -X PUT "${RIVET_S3_ENDPOINT}/${RIVET_S3_BUCKET}"
      - name: Certify native memory controller Redis and S3
        run: cargo run --example v07-production-cert -- all
      - name: Container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker logs rivet-redis || true
          docker logs rivet-minio || true

  windows-native-memory:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Verify exact revision
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXACT_SHA) { throw "RivetCache checkout mismatch: $actual != $env:EXACT_SHA" }
          Write-Host "RIVET_PRODUCTION_EXACT_HEAD=$actual"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Certify VirtualLock pool
        shell: powershell
        run: cargo run --example v07-production-cert -- native-memory
