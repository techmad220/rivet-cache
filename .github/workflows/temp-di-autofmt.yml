name: TEMP DI Autofmt

on:
  push:
    branches: [feat/di-core]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/di-core
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Patch counters, format, and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          for name in (
              'corruption_count',
              'expiration_count',
              'eviction_count',
              'memory_evictions',
              'disk_evictions',
          ):
              text = text.replace(f'let mut {name} = 0;', f'let mut {name} = 0_u64;')
          path.write_text(text)
          PY
          cargo fmt --all
          if git diff --quiet; then
            echo "No patch or formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix explicit DI counter types"
          git push origin HEAD:feat/di-core
