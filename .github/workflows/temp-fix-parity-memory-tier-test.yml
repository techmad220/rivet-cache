name: Temporary parity memory-tier test fix

on:
  push:
    branches: [feat/lmcache-parity-v0.9]

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/lmcache-parity-v0.9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Repair duplicate-name test fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/async_runtime.rs')
          s = p.read_text()
          if 'struct SecondaryMemoryTier' not in s:
              marker = '''    fn block(index: u32, value: u8) -> KvBlock {\n'''
              wrapper = '''    #[derive(Default)]\n    struct SecondaryMemoryTier(MemoryTier);\n\n    impl KvTier for SecondaryMemoryTier {\n        fn name(&self) -> &str {\n            "memory-secondary"\n        }\n\n        fn get(&self, key: &KvBlockKey) -> io::Result<Option<KvTierEntry>> {\n            self.0.get(key)\n        }\n\n        fn put(&self, entry: &KvTierEntry) -> io::Result<()> {\n            self.0.put(entry)\n        }\n\n        fn remove(&self, key: &KvBlockKey) -> io::Result<()> {\n            self.0.remove(key)\n        }\n\n        fn clear(&self) -> io::Result<()> {\n            self.0.clear()\n        }\n    }\n\n'''
              if s.count(marker) != 1:
                  raise SystemExit('block marker count mismatch')
              s = s.replace(marker, wrapper + marker, 1)
          old = '''        let engine = KvEngine::builder()\n            .tier(MemoryTier::default())\n            .tier(MemoryTier::default())\n            .build()\n            .unwrap();\n'''
          new = '''        let engine = KvEngine::builder()\n            .tier(MemoryTier::default())\n            .tier(SecondaryMemoryTier::default())\n            .build()\n            .unwrap();\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('two-tier fixture snippet not found')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --lib async_runtime::tests::batch_move_reports_a_miss_without_failing -- --exact
          changed="$(git diff --name-only)"
          test "$changed" = "src/async_runtime.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/async_runtime.rs
          if git diff --cached --quiet; then
            echo "RIVET_PARITY_TEST_FIX=ALREADY_APPLIED"
            exit 0
          fi
          git commit -m "Fix duplicate-name async move test fixture"
          git push origin HEAD:feat/lmcache-parity-v0.9
          echo "RIVET_PARITY_TEST_FIX=APPLIED"
