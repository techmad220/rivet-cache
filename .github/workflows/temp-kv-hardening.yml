name: Temporary KV runtime hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feat/kv-runtime-layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply hardening patch
        run: python tools/harden_kv_runtime.py

      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Remove one-shot hardening tooling
        run: |
          rm -f tools/harden_kv_runtime.py
          rm -f .github/workflows/temp-kv-hardening.yml
          rmdir tools 2>/dev/null || true

      - name: Commit clean hardened candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: harden KV orchestration semantics"

      - name: Package exact clean candidate
        run: |
          test -z "$(git status --porcelain)"
          cargo package --locked
          test -z "$(git status --porcelain)"

      - name: Push hardened candidate
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
