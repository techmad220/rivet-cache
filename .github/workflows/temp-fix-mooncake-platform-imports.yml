name: Temporary Mooncake platform import fix

on:
  push:
    branches: [feat/lmcache-parity-v0.9]

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/lmcache-parity-v0.9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Gate Linux-only Mooncake imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mooncake.rs')
          s = p.read_text()
          old = '''use crate::{KvBlockKey, KvTier, KvTierEntry, NativeKvSdk, NativeSdkKvTier};\nuse std::io;\nuse std::sync::Arc;\n'''
          new = '''use crate::{KvBlockKey, KvTier, KvTierEntry, NativeSdkKvTier};\n#[cfg(target_os = "linux")]\nuse crate::NativeKvSdk;\nuse std::io;\n#[cfg(target_os = "linux")]\nuse std::sync::Arc;\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Mooncake import block not found')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          changed="$(git diff --name-only)"
          test "$changed" = "src/mooncake.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/mooncake.rs
          if git diff --cached --quiet; then
            echo "RIVET_MOONCAKE_IMPORT_FIX=ALREADY_APPLIED"
            exit 0
          fi
          git commit -m "Gate Mooncake native imports to Linux"
          git push origin HEAD:feat/lmcache-parity-v0.9
          echo "RIVET_MOONCAKE_IMPORT_FIX=APPLIED"
