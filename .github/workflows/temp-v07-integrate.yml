name: Temporary v0.7 native integration

on:
  push:
    branches: [feat/v0.7-production-breadth]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/v0.7-production-breadth
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Integrate new modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib.rs')
          s = p.read_text()
          if 'mod direct_transport;' not in s:
              s = s.replace('mod device;\n', 'mod device;\nmod direct_transport;\n')
          if 'mod hip_native;' not in s:
              s = s.replace('mod gpu_direct;\n', 'mod gpu_direct;\nmod hip_native;\n')
          if 'mod llama_quality;' not in s:
              s = s.replace('mod llama_cpp;\n', 'mod llama_cpp;\nmod llama_quality;\n')
          if 'pub use direct_transport::GpuDirectTransferProvider;' not in s:
              s = s.replace('pub use device::{\n', 'pub use direct_transport::GpuDirectTransferProvider;\npub use device::{\n')
          if 'pub use hip_native::{HipDeviceMemory, HipDirectIo};' not in s:
              marker = 'pub use gpu_direct::{\n    FfiGpuDirectIo, FfiGpuDirectOps, GpuCopyFn, GpuDirectCapabilities, GpuDirectHealthFn,\n    GpuDirectIo, GpuFileReadFn, GpuFileWriteFn,\n};\n'
              s = s.replace(marker, marker + 'pub use hip_native::{HipDeviceMemory, HipDirectIo};\n')
          if 'pub use llama_quality::{' not in s:
              marker = 'pub use llama_cpp::{\n    FfiLlamaCppKvApi, LlamaCppAdapter, LlamaCppFfiOps, LlamaCppKvApi, LlamaHealthFn, LlamaKvSlice,\n    LlamaReadKvFn, LlamaWriteKvFn, MockLlamaCppKvApi,\n};\n'
              addition = 'pub use llama_quality::{\n    FfiLlamaCppRecomputeApi, LlamaCppQualityAdapter, LlamaCppRecomputeApi, LlamaRecomputeFn,\n};\n'
              s = s.replace(marker, marker + addition)
          p.write_text(s)

          p = Path('src/hip_native.rs')
          s = p.read_text()
          s = s.replace('''impl Drop for HipDeviceMemory {\n    fn drop(&mut self) {\n        if Arc::strong_count(&self.allocations) != 1 {\n            return;\n        }\n        if let Ok(mut allocations) = self.allocations.lock() {''', '''impl Drop for HipDeviceMemory {\n    fn drop(&mut self) {\n        if let Ok(mut allocations) = self.allocations.lock() {''')
          s = s.replace('''        if actual != buffer.len {\n            return Err(io::Error::new(\n                io::ErrorKind::InvalidData,\n                "HIP direct-I/O buffer length does not match allocation registry",\n            ));\n        }''', '''        if buffer.len > actual {\n            return Err(io::Error::new(\n                io::ErrorKind::InvalidData,\n                "HIP direct-I/O buffer metadata exceeds allocation registry length",\n            ));\n        }''')
          needle = '''    fn copy_device(\n        &self,\n        source: DeviceBuffer,\n        destination: DeviceBuffer,\n        bytes: usize,\n    ) -> io::Result<()> {\n        self.copy_device_range(source, 0, destination, 0, bytes)\n    }\n'''
          replacement = needle + '''\n    fn copy_device_range(\n        &self,\n        source: DeviceBuffer,\n        source_offset: usize,\n        destination: DeviceBuffer,\n        destination_offset: usize,\n        bytes: usize,\n    ) -> io::Result<()> {\n        HipDirectIo::copy_device_range(\n            self,\n            source,\n            source_offset,\n            destination,\n            destination_offset,\n            bytes,\n        )\n    }\n'''
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('hip copy_device integration marker missing')
              s = s.replace(needle, replacement)
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Debug tests
        run: cargo test --all-targets
      - name: Release tests
        run: cargo test --all-targets --release
      - name: Strict clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --all-targets
      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Rust 1.75 floor
        shell: bash
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 check --all-targets
      - name: Push normalized candidate and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-v07-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate native HIP and quality runtime adapters'
          git push origin HEAD:feat/v0.7-production-breadth
