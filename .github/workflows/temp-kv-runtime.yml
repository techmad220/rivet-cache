name: Temporary KV runtime certification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.event.pull_request.head.ref == 'feat/kv-runtime-layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply KV layer metadata/docs patch
        run: python tools/finish_kv_layer.py

      - name: Apply structural KV API fixes
        run: python tools/fix_kv_api.py

      - name: Normalize formatting
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Package gate
        run: cargo package --locked

      - name: Remove one-shot tooling
        run: |
          rm -f tools/finish_kv_layer.py
          rm -f tools/fix_kv_api.py
          rm -f .github/workflows/temp-kv-runtime.yml
          rmdir tools 2>/dev/null || true

      - name: Commit certified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add runtime-neutral KV orchestration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
