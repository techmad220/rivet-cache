name: Temporary v0.3.0 release cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'ops/release-v0.3.0-20260828'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: a437c06ca1b309046c2a559cbd7a4feba8b0ea4e
      TAG: v0.3.0
      BRANCH: ops/release-v0.3.0-20260828
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published release
        shell: bash
        run: |
          target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$TARGET_SHA"

      - name: Delete temporary release branch
        shell: bash
        run: |
          ref="heads/${BRANCH}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
