name: TEMP RivetCache Self Rebrand 20260828

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  rebrand:
    if: github.event.issue.title == 'run:rivetcache-self-rebrand-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rewrite
        run: python .ops/rivet-rebrand.py

      - name: Format and branding gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          legacy=$(printf '\141\151\157\156')
          if git grep -ni "$legacy" -- .; then
            echo 'legacy branding remains in tracked public content' >&2
            exit 1
          fi
          cargo fmt --all -- --check

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'techmad220'
          git config user.email '143960678+techmad220@users.noreply.github.com'
          git add Cargo.toml src/lib.rs examples/basic.rs README.md CERTIFICATION.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'Rebrand standalone cache as RivetCache'
          git push origin HEAD:main
          echo "RIVETCACHE_SELF_REBRAND=PASS head=$(git rev-parse HEAD)"

      - name: Receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="RIVETCACHE_SELF_REBRAND=PASS run=${{ github.run_id }} attempt=${{ github.run_attempt }} head=$(git rev-parse HEAD)"
          gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f "body=$receipt" >/dev/null
          echo "$receipt"

      - name: Failure receipt
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt="RIVETCACHE_SELF_REBRAND=FAIL run=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f "body=$receipt" >/dev/null
          echo "$receipt"
