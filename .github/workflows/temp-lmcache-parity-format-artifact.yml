name: Temporary LMCache parity formatter

on:
  push:
    branches: [feat/lmcache-parity-v0.9]

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/lmcache-parity-v0.9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              src/async_runtime.rs|src/mooncake.rs|src/mp.rs) ;;
              *) echo "unexpected formatter change: $path" >&2; exit 1 ;;
            esac
          done
          if [ ${#changed[@]} -eq 0 ]; then
            echo "RIVET_PARITY_FORMAT=ALREADY_CLEAN"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/async_runtime.rs src/mooncake.rs src/mp.rs
          git commit -m "Apply canonical rustfmt to parity modules"
          git push origin HEAD:feat/lmcache-parity-v0.9
          echo "RIVET_PARITY_FORMAT=APPLIED"
