name: Temporary normalize llama slot integration

on:
  push:
    branches:
      - feat/llama-server-slot-integration

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llama-server-slot-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix known defects
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/llama_server.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('use std::path::{Path, PathBuf};', 'use std::path::PathBuf;')
          s = s.replace('format!(".{filename}.{}.{}.tmp", std::process::id(), nonce)', 'format!("tmp-{filename}.{}.{}.tmp", std::process::id(), nonce)')
          p.write_text(s, encoding='utf-8')
          p = Path('src/bin/rivet-cache-llama-slot.rs')
          s = p.read_text(encoding='utf-8').replace('RIVET_LLAMA_SLOT_CONTAINS={} ', 'RIVET_LLAMA_SLOT_CONTAINS={}')
          p.write_text(s, encoding='utf-8')
      - name: Format
        run: cargo fmt --all
      - name: Test all targets
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/temp-fix-llama-slot.yml
      - name: Commit normalized candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Fix and format llama-server slot integration"
          git push origin HEAD:feat/llama-server-slot-integration
